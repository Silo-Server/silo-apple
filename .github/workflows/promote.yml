name: Promote to App Store

# Turns a TestFlight build into a store release without rebuilding it: drafts
# the GitHub release vX.Y.Z on the build's commit, with notes since the last
# App Store release. Submitting the build for App Review happens in App Store
# Connect. Publish the draft once Apple approves the version.
# See docs/release/ci-release.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'TestFlight build to release, for example v1.0.0-beta.66'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BETA_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
          persist-credentials: false

      - name: Draft the GitHub release
        run: |
          set -euo pipefail
          python3 scripts/ci/release-version.py beta "$BETA_TAG" > build.txt
          version="$(sed -n 's/^version=//p' build.txt)"
          build="$(sed -n 's/^build=//p' build.txt)"
          release_tag="$(sed -n 's/^release_tag=//p' build.txt)"
          # One store release covers both platforms, so promote only a build
          # that reached testers on iOS and tvOS.
          if [[ "$(gh release view "$BETA_TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null)" != "true" ]] ||
             ! gh release view "$BETA_TAG" --json body --jq .body | grep -q '^TestFlight: distributed .* on iOS and tvOS\.$'; then
            echo "::error::$BETA_TAG didn't reach TestFlight testers on both iOS and tvOS, so it can't be promoted."
            exit 1
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "::error::$release_tag already exists (possibly as a draft). Delete the draft to promote again."
            exit 1
          fi
          commit="$(gh api "repos/$GH_REPO/commits/$BETA_TAG" --jq .sha)"
          # Notes cover everything since the previous App Store release. The
          # first App Store release has none to start from, so its notes are
          # written by hand.
          previous="$(python3 scripts/ci/release-version.py previous-release "$release_tag" | sed -n 's/^previous_release=//p')"
          {
            echo "Silo $version, build $build: the TestFlight build $BETA_TAG."
            echo
            if [[ -n "$previous" ]]; then
              gh api "repos/$GH_REPO/releases/generate-notes" \
                -f tag_name="$release_tag" -f target_commitish="$commit" \
                -f previous_tag_name="$previous" --jq .body
            else
              echo "First App Store release: replace this line with release notes."
            fi
            echo
            echo "The source archive this build links to is on the $BETA_TAG release."
          } > notes.md
          gh release create "$release_tag" --draft --target "$commit" \
            --title "Silo $version" --notes-file notes.md
          {
            echo "Drafted $release_tag."
            echo
            echo "1. In App Store Connect, add build $build to the iOS and tvOS $version versions and submit them for review."
            echo "2. Start the next version now: run TestFlight Release with bump: patch or minor. Its first build's Beta App Review then runs alongside App Review."
            echo "3. Edit the draft notes on GitHub, and publish the release when Apple approves $version."
          } >> "$GITHUB_STEP_SUMMARY"
