name: Evidence deadline

# Closes contributors' pull requests that still have no evidence 24 hours after
# they open, as CONTRIBUTING.md describes. The rules live in silo-server's
# reusable-evidence-deadline.yml, which every Silo app repository calls.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the pull requests that would close without closing them.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: evidence-deadline

jobs:
  close:
    permissions:
      checks: read
      issues: read
      pull-requests: write
    uses: Silo-Server/silo-server/.github/workflows/reusable-evidence-deadline.yml@main
    with:
      # Log only, closing nothing, until EVIDENCE_DEADLINE_ENFORCE is "true" as a
      # repository or organization variable.
      dry_run: ${{ inputs.dry_run == true || vars.EVIDENCE_DEADLINE_ENFORCE != 'true' }}
