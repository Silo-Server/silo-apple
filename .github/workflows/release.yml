name: TestFlight Release

on:
  push:
    # v* -> both platforms; the +ios / +tvos build-metadata suffix
    # (v1.4.0+ios / v1.4.0+tvos) targets that platform only. Both match 'v*'.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.4.0)'
        required: true
        type: string
      platform:
        description: 'Which platform(s) to release'
        required: true
        type: choice
        default: both
        options:
          - both
          - ios
          - tvos

# Serialize releases: each run computes latest_testflight_build_number + 1,
# so overlapping runs would collide. Let an in-flight release finish.
concurrency:
  group: testflight-release
  cancel-in-progress: false

# Apple build jobs only read the repository. The source publication job gets
# contents: write so it can attach rebuild sources before binary distribution.
permissions:
  contents: read

env:
  TESTFLIGHT_DISTRIBUTION: external
  TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: "true"
  SILO_CACHE_NAMESPACE: production

jobs:
  # A trusted complete main run can gate this exact commit. Toolchain or source
  # uncertainty selects the full suite; an error in preflight blocks the release.
  preflight:
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reusable: ${{ steps.proof.outputs.reusable }}
      regression_run_url: ${{ steps.proof.outputs.run_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Record release source and toolchain
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --outputs
      - name: Find matching main regression proof
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_FINGERPRINT: ${{ steps.metadata.outputs.fingerprint }}
          EXPECTED_LOCK_SHA256: ${{ steps.metadata.outputs.lock_sha256 }}
          EXPECTED_TOOLCHAIN_JSON: ${{ steps.metadata.outputs.toolchain_json }}
        run: python3 scripts/ci/find-regression-proof.py

  tests:
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.reusable != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/player-regression.yml
    with:
      release_gate: true

  regression-gate:
    needs: [preflight, tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted regression success
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REUSABLE: ${{ needs.preflight.outputs.reusable }}
          TEST_RESULT: ${{ needs.tests.result }}
          REGRESSION_RUN_URL: ${{ needs.preflight.outputs.regression_run_url }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_RESULT" != success ]; then
            echo "::error::Release preflight did not succeed"
            exit 1
          fi
          if [ "$REUSABLE" = true ] && [ "$TEST_RESULT" = skipped ]; then
            echo "Reusing complete regression proof: $REGRESSION_RUN_URL"
          elif [ "$REUSABLE" != true ] && [ "$TEST_RESULT" = success ]; then
            echo "The full release regression suite passed"
          else
            echo "::error::Release requires matching proof or a successful full regression suite"
            exit 1
          fi

  source:
    needs: [regression-gate, setup]
    if: ${{ !cancelled() && needs.regression-gate.result == 'success' && needs.setup.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-source.yml
    with:
      release_tag: ${{ github.event_name == 'push' && github.ref_name || format('source-{0}', github.sha) }}

  # Resolve release inputs once so archive and distribution select identical
  # versions, build numbers, and release notes for each platform.
  setup:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.p.outputs.platform }}
      version: ${{ steps.ver.outputs.value }}
      changelog: ${{ steps.changelog.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: p
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          P="$(scripts/ci/resolve-platform.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_PLATFORM")"
          echo "platform=$P" >> "$GITHUB_OUTPUT"
          echo "Release platform: $P"
      - name: Resolve marketing version
        id: ver
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="$(scripts/ci/resolve-marketing-version.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_VERSION")"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $V"
      - name: Capture release changelog
        id: changelog
        run: |
          python3 - <<'PY_CHANGELOG'
          import os
          import subprocess
          import uuid
          changelog = subprocess.check_output(
              ['git', 'log', '-1', '--pretty=format:%s'], text=True).strip()
          delimiter = 'silo_changelog_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value<<{delimiter}\n{changelog}\n{delimiter}\n')
          PY_CHANGELOG

  # Reserve each build number once, before the platform archives fan out.
  # The workflow release lock remains held through Linux distribution.
  build-numbers:
    needs: [setup, regression-gate]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.regression-gate.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ios_build: ${{ steps.bn.outputs.ios_build }}
      tvos_build: ${{ steps.bn.outputs.tvos_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Reserve per-platform build numbers
        id: bn
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          BUILD_NUMBERS_FILE="$GITHUB_OUTPUT" bundle exec fastlane ios reserve_build_numbers

  ios:
    needs: [regression-gate, setup, build-numbers, source]
    if: >-
      !cancelled() && needs.regression-gate.result == 'success' &&
      needs.setup.result == 'success' && needs.build-numbers.result == 'success' &&
      needs.source.result == 'success' && needs.setup.outputs.platform != 'tvos'
    runs-on: xcode-27
    env:
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci-cache/packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Record archive cache inputs
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --device-scheme Silo-device --outputs

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore release packages
        id: cache
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: restore
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: Silo-device

      - name: Build and upload iOS to TestFlight
        run: bundle exec fastlane ios beta_ios
        env:
          MARKETING_VERSION: ${{ needs.setup.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-numbers.outputs.ios_build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.setup.outputs.changelog }}
          SILO_DEFER_TESTFLIGHT_DISTRIBUTION: 'true'
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

      - name: Report archive package cache size
        continue-on-error: true
        run: |
          if [ -d "$SILO_SOURCE_PACKAGES_PATH" ]; then
            size_kib=$(du -sk "$SILO_SOURCE_PACKAGES_PATH" | cut -f1)
            echo "Package cache: $size_kib KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No package cache directory was produced" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save release packages after successful upload
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: save
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: Silo-device
          save-cache: 'true'
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}

  tvos:
    needs: [regression-gate, setup, build-numbers, source]
    if: >-
      !cancelled() && needs.regression-gate.result == 'success' &&
      needs.setup.result == 'success' && needs.build-numbers.result == 'success' &&
      needs.source.result == 'success' && needs.setup.outputs.platform != 'ios'
    runs-on: xcode-27
    env:
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci-cache/packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Record archive cache inputs
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --device-scheme SiloTV-device --outputs

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore release packages
        id: cache
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: restore
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: SiloTV-device

      - name: Build and upload tvOS to TestFlight
        run: bundle exec fastlane ios beta_tvos
        env:
          MARKETING_VERSION: ${{ needs.setup.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-numbers.outputs.tvos_build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.setup.outputs.changelog }}
          SILO_DEFER_TESTFLIGHT_DISTRIBUTION: 'true'
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

      - name: Report archive package cache size
        continue-on-error: true
        run: |
          if [ -d "$SILO_SOURCE_PACKAGES_PATH" ]; then
            size_kib=$(du -sk "$SILO_SOURCE_PACKAGES_PATH" | cut -f1)
            echo "Package cache: $size_kib KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No package cache directory was produced" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save release packages after successful upload
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: save
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: SiloTV-device
          save-cache: 'true'
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}

  ios-distribution:
    needs: [ios, setup, build-numbers, source, regression-gate]
    if: >-
      !cancelled() && needs.ios.result == 'success' &&
      needs.regression-gate.result == 'success' && needs.setup.result == 'success' &&
      needs.build-numbers.result == 'success' && needs.source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Wait for and distribute the uploaded iOS build
        run: bundle exec fastlane ios distribute_ios
        env:
          MARKETING_VERSION: ${{ needs.setup.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-numbers.outputs.ios_build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.setup.outputs.changelog }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

  tvos-distribution:
    needs: [tvos, setup, build-numbers, source, regression-gate]
    if: >-
      !cancelled() && needs.tvos.result == 'success' &&
      needs.regression-gate.result == 'success' && needs.setup.result == 'success' &&
      needs.build-numbers.result == 'success' && needs.source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Wait for and distribute the uploaded tvOS build
        run: bundle exec fastlane ios distribute_tvos
        env:
          MARKETING_VERSION: ${{ needs.setup.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-numbers.outputs.tvos_build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.setup.outputs.changelog }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}
