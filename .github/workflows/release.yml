name: TestFlight Release

on:
  push:
    # v* -> both platforms; the +ios / +tvos build-metadata suffix
    # (v1.4.0+ios / v1.4.0+tvos) targets that platform only. Both match 'v*'.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.4.0)'
        required: true
        type: string
      platform:
        description: 'Which platform(s) to release'
        required: true
        type: choice
        default: both
        options:
          - both
          - ios
          - tvos

# Serialize releases: each run computes latest_testflight_build_number + 1,
# so overlapping runs would collide. Let an in-flight release finish.
concurrency:
  group: testflight-release
  cancel-in-progress: false

# Least privilege: the jobs only check out code and talk to Apple via the ASC
# API key. They never use GITHUB_TOKEN to write to the repo.
permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.43.0"
  TESTFLIGHT_DISTRIBUTION: external
  TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: "true"

jobs:
  # Resolve the target platform from either the dispatch input or the tag's
  # +ios / +tvos build-metadata suffix, so both trigger paths share one gate.
  setup:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.p.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          P="$(scripts/ci/resolve-platform.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_PLATFORM")"
          echo "platform=$P" >> "$GITHUB_OUTPUT"
          echo "Release platform: $P"

  # Reserve the next build number per platform ONCE, before the platform builds
  # fan out. The ios/tvos jobs then consume these fixed values instead of each
  # querying latest_testflight_build_number concurrently — which lets them run in
  # parallel with no build-number race. Query-only, so it runs on Linux with just
  # the ASC API key (no signing/match/team secrets).
  build-numbers:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      ios_build: ${{ steps.bn.outputs.ios_build }}
      tvos_build: ${{ steps.bn.outputs.tvos_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Reserve per-platform build numbers
        id: bn
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          # The lane appends ios_build=/tvos_build= lines to BUILD_NUMBERS_FILE.
          BUILD_NUMBERS_FILE="$GITHUB_OUTPUT" bundle exec fastlane ios reserve_build_numbers

  ios:
    needs: [setup, build-numbers]
    # Skip only when the selection is tvOS-only. 'both' and 'ios' both run iOS.
    # No status function in the if -> implicit success() gate on needs, so a
    # failed build-numbers job skips this build.
    if: ${{ needs.setup.outputs.platform != 'tvos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for changelog fallback

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          sudo /tmp/xcodegen-dist/xcodegen/install.sh /usr/local
          xcodegen --version

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Resolve marketing version
        id: ver
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$(scripts/ci/resolve-marketing-version.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_VERSION")"
          {
            echo "value<<EOF"
            echo "$V"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $V"

      - name: Build & upload iOS to TestFlight
        run: bundle exec fastlane ios beta_ios
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.value }}
          BUILD_NUMBER: ${{ needs.build-numbers.outputs.ios_build }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}

  tvos:
    # No longer needs: ios — build numbers are reserved up front, so tvOS runs in
    # parallel with iOS rather than after it. (Trade-off: on a both run, tvOS now
    # releases even if iOS fails; the platforms' build-number sequences are
    # independent, so a gap is harmless.)
    needs: [setup, build-numbers]
    # Skip only when the selection is iOS-only. Implicit success() gate on needs.
    if: ${{ needs.setup.outputs.platform != 'ios' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          sudo /tmp/xcodegen-dist/xcodegen/install.sh /usr/local
          xcodegen --version

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Resolve marketing version
        id: ver
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$(scripts/ci/resolve-marketing-version.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_VERSION")"
          {
            echo "value<<EOF"
            echo "$V"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $V"

      - name: Build & upload tvOS to TestFlight
        run: bundle exec fastlane ios beta_tvos
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.value }}
          BUILD_NUMBER: ${{ needs.build-numbers.outputs.tvos_build }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
