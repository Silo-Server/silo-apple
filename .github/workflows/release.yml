name: TestFlight Release

# Makes a TestFlight build: tags the commit vX.Y.Z-beta.B, publishes a GitHub
# prerelease with notes on what changed since the last build, and uploads iOS
# and tvOS build B of marketing version X.Y.Z to TestFlight. X.Y.Z stays the
# same until promote.yml drafts its App Store release, so later builds skip
# Beta App Review.
# See docs/release/ci-release.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'build = another build of the unreleased version. minor or patch = start the next version once the current one is promoted.'
        required: true
        type: choice
        default: build
        options:
          - build
          - minor
          - patch
      version:
        description: 'Optional: use this marketing version (for example 1.2.0) instead of bump.'
        required: false
        type: string
      platform:
        description: 'Which platform(s) to release'
        required: true
        type: choice
        default: both
        options:
          - both
          - ios
          - tvos

# Serialize releases: each run takes the next build number, so overlapping
# runs would collide. Let an in-flight release finish.
concurrency:
  group: testflight-release
  cancel-in-progress: false

# Apple build jobs only read the repository. The release and source jobs get
# contents: write to publish the prerelease and its rebuild sources before
# binary distribution.
permissions:
  contents: read

env:
  TESTFLIGHT_DISTRIBUTION: external
  TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: "true"
  SILO_CACHE_NAMESPACE: production

jobs:
  # A trusted complete main run can gate this exact commit. Toolchain or source
  # uncertainty selects the full suite; an error in preflight blocks the release.
  preflight:
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reusable: ${{ steps.proof.outputs.reusable }}
      regression_run_url: ${{ steps.proof.outputs.run_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Record release source and toolchain
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --outputs
      - name: Find matching main regression proof
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_FINGERPRINT: ${{ steps.metadata.outputs.fingerprint }}
          EXPECTED_LOCK_SHA256: ${{ steps.metadata.outputs.lock_sha256 }}
          EXPECTED_TOOLCHAIN_JSON: ${{ steps.metadata.outputs.toolchain_json }}
        run: python3 scripts/ci/find-regression-proof.py

  tests:
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.reusable != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/player-regression.yml
    with:
      release_gate: true

  regression-gate:
    needs: [preflight, tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted regression success
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REUSABLE: ${{ needs.preflight.outputs.reusable }}
          TEST_RESULT: ${{ needs.tests.result }}
          REGRESSION_RUN_URL: ${{ needs.preflight.outputs.regression_run_url }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_RESULT" != success ]; then
            echo "::error::Release preflight did not succeed"
            exit 1
          fi
          if [ "$REUSABLE" = true ] && [ "$TEST_RESULT" = skipped ]; then
            echo "Reusing complete regression proof: $REGRESSION_RUN_URL"
          elif [ "$REUSABLE" != true ] && [ "$TEST_RESULT" = success ]; then
            echo "The full release regression suite passed"
          else
            echo "::error::Release requires matching proof or a successful full regression suite"
            exit 1
          fi

  # Choose the version, build number and tag once so every job agrees on them.
  # Runs first, so a bad bump fails before the regression suite.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # list draft releases, which read-only tokens can't see
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Look up the latest TestFlight build
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: BUILD_NUMBERS_FILE="$RUNNER_TEMP/testflight.env" bundle exec fastlane ios next_build_number
      # A promoted version waiting for App Review (a draft vX.Y.Z release)
      # counts as released.
      - name: Choose version and build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          min_build="$(sed -n 's/^next_build=//p' "$RUNNER_TEMP/testflight.env")"
          if [ -z "$min_build" ]; then
            echo "::error::Could not read the latest TestFlight build number."
            exit 1
          fi
          # Read every page: a draft can be older than the newest 100 releases.
          draft_tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft) | .tag_name')"
          drafts=()
          for draft in $draft_tags; do
            drafts+=(--draft "$draft")
          done
          python3 scripts/ci/release-version.py next --bump "$BUMP" --version "$VERSION" \
            --min-build "$min_build" "${drafts[@]}" | tee -a "$GITHUB_OUTPUT"
      # A prerelease without the distribution note comes from a run that failed
      # before testers got the build. Starting this build's notes there would
      # leave out changes no tester got.
      - name: Require the previous build to have reached testers
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_TAG" ] && ! gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body | grep -q '^TestFlight: distributed '; then
            echo "::error::$PREVIOUS_TAG never reached TestFlight testers. Re-run that run's failed jobs, or delete its GitHub release and tag, then run Release again."
            exit 1
          fi

  # Publish the prerelease once the regression gate passes, before any binary:
  # the app links its source archive, which must be public first.
  release:
    needs: [regression-gate, prepare]
    if: ${{ !cancelled() && needs.regression-gate.result == 'success' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release (and generate its notes)
    outputs:
      changelog: ${{ steps.changelog.outputs.value }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Write release notes
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            ${PREVIOUS_TAG:+-f previous_tag_name="$PREVIOUS_TAG"} --jq .body > "$RUNNER_TEMP/notes.md"
      # TestFlight's "What to Test", leaving room for the source line the
      # Fastfile appends (4,000 max): Claude's summary of the pull request
      # titles, or the plain list of Features and Fixes when that fails or
      # ANTHROPIC_API_KEY isn't set. The key exists only in this step, on a
      # GitHub-hosted runner, and the workflow only runs by manual dispatch.
      - name: Write What to Test
        id: changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          what_to_test="$RUNNER_TEMP/what-to-test.txt"
          if scripts/ci/summarize-what-to-test.sh "$RUNNER_TEMP/notes.md" 3800 > "$what_to_test"; then
            source="Claude's summary of the merged pull requests"
          else
            echo "::warning::What to Test uses the plain list because the summary failed (see above)."
            python3 scripts/ci/release-version.py store-notes 3800 < "$RUNNER_TEMP/notes.md" > "$what_to_test"
            source="the plain list of Features and Fixes"
          fi
          {
            echo "### What to Test"
            echo
            echo "From $source:"
            echo
            # Indented, so the text shows as a code block whatever it contains.
            sed 's/^/    /' "$what_to_test"
          } >> "$GITHUB_STEP_SUMMARY"
          delimiter="silo_changelog_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "value<<$delimiter"
            cat "$what_to_test"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub prerelease
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          # A re-run of this run's failed jobs finds its own release. Anything
          # else holding the tag is a different build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already belongs to another commit. Run Release again for a new build number."
              exit 1
            fi
            echo "$TAG already exists for this commit; re-using it."
            exit 0
          fi
          case "$PLATFORM" in
            ios) platforms="iOS" ;;
            tvos) platforms="tvOS" ;;
            *) platforms="iOS and tvOS" ;;
          esac
          {
            echo "TestFlight build $VERSION ($BUILD) for $platforms."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Source and rebuild instructions are in the Silo-source archive."
          } > notes.md
          # A prerelease never becomes Latest; that stays the App Store release.
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Silo $VERSION ($BUILD)" --notes-file notes.md

  source:
    needs: [regression-gate, prepare, release]
    if: ${{ !cancelled() && needs.regression-gate.result == 'success' && needs.release.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-source.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  ios:
    needs: [regression-gate, prepare, release, source]
    if: >-
      !cancelled() && needs.regression-gate.result == 'success' &&
      needs.prepare.result == 'success' && needs.source.result == 'success' &&
      inputs.platform != 'tvos'
    runs-on: xcode-27
    env:
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci-cache/packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Record archive cache inputs
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --device-scheme Silo-device --outputs

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore release packages
        id: cache
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: restore
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: Silo-device

      - name: Build and upload iOS to TestFlight
        run: bundle exec fastlane ios beta_ios
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.release.outputs.changelog }}
          SILO_DEFER_TESTFLIGHT_DISTRIBUTION: 'true'
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

      - name: Report archive package cache size
        continue-on-error: true
        run: |
          if [ -d "$SILO_SOURCE_PACKAGES_PATH" ]; then
            size_kib=$(du -sk "$SILO_SOURCE_PACKAGES_PATH" | cut -f1)
            echo "Package cache: $size_kib KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No package cache directory was produced" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save release packages after successful upload
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: save
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: Silo-device
          save-cache: 'true'
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}

  tvos:
    needs: [regression-gate, prepare, release, source]
    if: >-
      !cancelled() && needs.regression-gate.result == 'success' &&
      needs.prepare.result == 'success' && needs.source.result == 'success' &&
      inputs.platform != 'ios'
    runs-on: xcode-27
    env:
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci-cache/packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Record archive cache inputs
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --device-scheme SiloTV-device --outputs

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore release packages
        id: cache
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: restore
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: SiloTV-device

      - name: Build and upload tvOS to TestFlight
        run: bundle exec fastlane ios beta_tvos
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.release.outputs.changelog }}
          SILO_DEFER_TESTFLIGHT_DISTRIBUTION: 'true'
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

      - name: Report archive package cache size
        continue-on-error: true
        run: |
          if [ -d "$SILO_SOURCE_PACKAGES_PATH" ]; then
            size_kib=$(du -sk "$SILO_SOURCE_PACKAGES_PATH" | cut -f1)
            echo "Package cache: $size_kib KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No package cache directory was produced" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save release packages after successful upload
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: save
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: SiloTV-device
          save-cache: 'true'
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}

  ios-distribution:
    needs: [ios, prepare, release, source, regression-gate]
    if: >-
      !cancelled() && needs.ios.result == 'success' &&
      needs.regression-gate.result == 'success' && needs.prepare.result == 'success' &&
      needs.source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Wait for and distribute the uploaded iOS build
        run: bundle exec fastlane ios distribute_ios
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.release.outputs.changelog }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

  tvos-distribution:
    needs: [tvos, prepare, release, source, regression-gate]
    if: >-
      !cancelled() && needs.tvos.result == 'success' &&
      needs.regression-gate.result == 'success' && needs.prepare.result == 'success' &&
      needs.source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Wait for and distribute the uploaded tvOS build
        run: bundle exec fastlane ios distribute_tvos
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          TESTFLIGHT_CHANGELOG: ${{ needs.release.outputs.changelog }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

  # Note on the prerelease which platforms reached testers. Promotion and the
  # next run's notes rely on it.
  record:
    needs: [prepare, ios-distribution, tvos-distribution]
    if: ${{ !cancelled() && (needs.ios-distribution.result == 'success' || needs.tvos-distribution.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Note the distribution on the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          IOS: ${{ needs.ios-distribution.result }}
          TVOS: ${{ needs.tvos-distribution.result }}
        run: |
          set -euo pipefail
          if [ "$IOS" = success ] && [ "$TVOS" = success ]; then
            platforms="iOS and tvOS"
          elif [ "$IOS" = success ]; then
            platforms="iOS"
          else
            platforms="tvOS"
          fi
          gh release view "$TAG" --json body --jq .body > body.md
          {
            grep -v '^TestFlight: distributed ' body.md || true
            echo "TestFlight: distributed $VERSION ($BUILD) to external testers on $platforms."
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
