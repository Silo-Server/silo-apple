name: Apple regression

on:
  pull_request:
    paths:
      - 'iosApp/**'
      - '.github/workflows/player-regression.yml'
      - '.github/actions/cache-spm/**'
      - '.github/actions/install-xcodegen/**'
      - 'scripts/ci/apple-build-metadata*'
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - '.github/workflows/player-regression.yml'
      - '.github/actions/cache-spm/**'
      - '.github/actions/install-xcodegen/**'
      - 'scripts/ci/apple-build-metadata*'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional unchanged upstream commit for a comparative iOS run (the tvOS test target may not exist there)
        type: string
        required: false
      record_preview:
        description: Also record a synthetic playback clip after a manually requested build
        type: boolean
        default: false
      ios_only:
        description: Build and validate only the iOS simulator app for an iOS-only change
        type: boolean
        default: false
      benchmark_source_ref:
        description: Optional immutable 40-character app commit for a controlled benchmark
        type: string
        required: false
      benchmark_variant:
        description: Compare the original build sequence with the optimized sequence
        type: choice
        default: optimized
        options: [baseline, optimized]
      cache_mode:
        description: Compilation caching is an opt-in experiment
        type: choice
        default: dependencies
        options: ['off', dependencies, derived_data]
      cache_namespace:
        description: Isolate benchmark caches (1-32 lowercase letters, digits, underscores or hyphens)
        type: string
        default: production
      benchmark_platform:
        description: Platforms to include in the controlled benchmark
        type: choice
        default: all
        options: [all, ios, tvos, macos]
  # release.yml calls this to gate TestFlight uploads on the full suite.
  workflow_call:
    inputs:
      release_gate:
        description: Keeps a release run out of the PR and main concurrency groups
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Manual comparisons must finish independently; PR and main runs coalesce by ref.
  # Release runs retain their own group so a main push cannot cancel a release gate.
  group: player-regression-${{ inputs.release_gate && 'release-' || '' }}${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: true

jobs:
  validate:
    # Same Xcode 27 image as the release builds.
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((inputs.ios_only || inputs.baseline_ref || inputs.benchmark_platform == 'ios') &&
            '[{"scheme":"Silo","destination":"platform=iOS Simulator,name=iPhone 17 Pro","action":"test","platform":"iOS","test_target":"SiloTests"}]' ||
            inputs.benchmark_platform == 'tvos' &&
            '[{"scheme":"SiloTV","destination":"platform=tvOS Simulator,name=Apple TV 4K (3rd generation)","action":"test","platform":"tvOS","test_target":"SiloTVTests"}]' ||
            inputs.benchmark_platform == 'macos' &&
            '[{"scheme":"SiloMac","destination":"generic/platform=macOS","action":"build","platform":"macOS"}]' ||
            '[{"scheme":"Silo","destination":"platform=iOS Simulator,name=iPhone 17 Pro","action":"test","platform":"iOS","test_target":"SiloTests"},
              {"scheme":"SiloTV","destination":"platform=tvOS Simulator,name=Apple TV 4K (3rd generation)","action":"test","platform":"tvOS","test_target":"SiloTVTests"},
              {"scheme":"SiloMac","destination":"generic/platform=macOS","action":"build","platform":"macOS"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      SILO_BENCH_VARIANT: ${{ inputs.benchmark_variant || 'optimized' }}
      SILO_BENCHMARK_SOURCE_REF: ${{ inputs.benchmark_source_ref }}
      SILO_CACHE_MODE: ${{ inputs.benchmark_variant == 'baseline' && 'off' || inputs.cache_mode || 'dependencies' }}
      SILO_CACHE_NAMESPACE: ${{ inputs.cache_namespace || 'production' }}
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/source/.ci-cache/packages
      SILO_DERIVED_DATA: ${{ inputs.benchmark_variant == 'baseline' && '/tmp/silo-derived' || format('{0}/source/.ci-cache/derived/{1}', github.workspace, matrix.scheme) }}
      PLATFORM: ${{ matrix.platform }}
      SCHEME: ${{ matrix.scheme }}
      DESTINATION: ${{ matrix.destination }}
      ACTION: ${{ matrix.action }}
    steps:
      # The controller supplies current actions/helpers while the app checkout may
      # be an older immutable benchmark commit. Every build runs from source/.
      - name: Checkout CI controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ci
          ref: ${{ github.sha }}
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
          ref: ${{ inputs.benchmark_source_ref || inputs.baseline_ref || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Record build inputs
        id: metadata
        run: python3 ../ci/scripts/ci/apple-build-metadata.py --root . --outputs
      - name: Install XcodeGen
        id: xcodegen
        if: env.SILO_BENCH_VARIANT != 'baseline'
        uses: ./ci/.github/actions/install-xcodegen
        with:
          cache: ${{ env.SILO_CACHE_MODE != 'off' }}
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          save-cache: ${{ !inputs.release_gate }}
      - name: Generate Xcode project before simulator boot
        if: env.SILO_BENCH_VARIANT != 'baseline'
        run: xcodegen generate --spec iosApp/project.yml
      - name: Restore build caches
        if: env.SILO_BENCH_VARIANT != 'baseline'
        id: cache
        uses: ./ci/.github/actions/cache-spm
        with:
          operation: restore
          mode: ${{ env.SILO_CACHE_MODE }}
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: ${{ matrix.scheme }}
      - name: Resolve locked packages once
        if: env.SILO_BENCH_VARIANT != 'baseline'
        run: |
          set -euo pipefail
          lock=iosApp/Silo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          lock_before=$(shasum -a 256 "$lock")
          xcodebuild -resolvePackageDependencies -project iosApp/Silo.xcodeproj -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SILO_SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            | tee /tmp/package-resolution.log
          test "$lock_before" = "$(shasum -a 256 "$lock")"
      - name: Prepare simulator
        if: matrix.action == 'test'
        timeout-minutes: 10
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Hosted images do not always have a usable pre-created device.
          # Match the selected Xcode SDK and reuse one explicit destination.
          # iOS and tvOS differ only in SDK name, runtime prefix, and device.
          case "$PLATFORM" in
            iOS)
              sdk=iphonesimulator
              runtime_prefix=com.apple.CoreSimulator.SimRuntime.iOS-
              device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
              destination_platform="iOS Simulator"
              ;;
            tvOS)
              sdk=appletvsimulator
              runtime_prefix=com.apple.CoreSimulator.SimRuntime.tvOS-
              device_type=com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
              destination_platform="tvOS Simulator"
              ;;
            *)
              echo "::error::Unknown simulator platform $PLATFORM"
              exit 1
              ;;
          esac
          runtime_version=$(xcrun --sdk "$sdk" --show-sdk-version)
          find_runtime() {
            xcrun simctl list runtimes --json | jq -r --arg version "$runtime_version" --arg prefix "$runtime_prefix" \
              '[.runtimes[] | select(.isAvailable and .version == $version and
                (.identifier | startswith($prefix)))][0].identifier // empty'
          }
          runtime_id=$(find_runtime)
          if [ -z "$runtime_id" ]; then
            xcodebuild -downloadPlatform "$PLATFORM" -buildVersion "$runtime_version"
            runtime_id=$(find_runtime)
          fi
          if [ -z "$runtime_id" ]; then
            echo "::error::No available $PLATFORM $runtime_version simulator runtime"
            exit 1
          fi
          simulator_id=$(xcrun simctl create "Silo-Player-Regression-$PLATFORM" \
            "$device_type" "$runtime_id")
          echo "SILO_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "SILO_TEST_DESTINATION=platform=$destination_platform,id=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Generate Xcode project (baseline sequence)
        if: env.SILO_BENCH_VARIANT == 'baseline'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          /tmp/xcodegen-dist/xcodegen/bin/xcodegen generate --spec iosApp/project.yml
      - name: Build player
        id: build
        run: |
          set -euo pipefail
          package_args=()
          if [ "$SILO_BENCH_VARIANT" != baseline ]; then
            package_args=(-clonedSourcePackagesDirPath "$SILO_SOURCE_PACKAGES_PATH"
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile)
          fi
          if [ "$ACTION" = test ]; then
            # Simulator-only ad-hoc signing supplies the application identifier
            # required by Keychain. No certificate or release secret is used.
            xcodebuild build-for-testing -project iosApp/Silo.xcodeproj -scheme "$SCHEME" \
              -destination "$SILO_TEST_DESTINATION" -derivedDataPath "$SILO_DERIVED_DATA" \
              ${package_args[@]+"${package_args[@]}"} -showBuildTimingSummary \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee /tmp/player-build.log
          else
            xcodebuild build -project iosApp/Silo.xcodeproj -scheme "$SCHEME" \
              -destination "$DESTINATION" -derivedDataPath "$SILO_DERIVED_DATA" \
              ${package_args[@]+"${package_args[@]}"} -showBuildTimingSummary \
              -resultBundlePath /tmp/player-validation.xcresult \
              CODE_SIGNING_ALLOWED=NO | tee /tmp/player-validation.log
          fi
      - name: Package simulator tests for focused visual verification
        if: matrix.action == 'test' && matrix.platform == 'iOS' && !inputs.baseline_ref
        run: ditto -c -k --keepParent "$SILO_DERIVED_DATA/Build/Products" /tmp/Silo-simulator-tests.zip
      - name: Upload compiled simulator tests
        if: matrix.action == 'test' && matrix.platform == 'iOS' && !inputs.baseline_ref
        uses: actions/upload-artifact@v4
        with:
          name: Silo-simulator-tests
          path: /tmp/Silo-simulator-tests.zip
          retention-days: 3
      # Xcode 27 can spend ten minutes collecting simulator diagnostics after the
      # tests finish, which would run past this step's timeout.
      - name: Run complete simulator suite
        if: matrix.action == 'test'
        timeout-minutes: 12
        env:
          TEST_TARGET: ${{ matrix.test_target }}
        run: |
          set -euo pipefail
          package_args=()
          if [ "$SILO_BENCH_VARIANT" != baseline ]; then
            package_args=(-clonedSourcePackagesDirPath "$SILO_SOURCE_PACKAGES_PATH"
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile)
          fi
          xcodebuild test-without-building -project iosApp/Silo.xcodeproj -scheme "$SCHEME" \
            -destination "$SILO_TEST_DESTINATION" -derivedDataPath "$SILO_DERIVED_DATA" \
            ${package_args[@]+"${package_args[@]}"} -showBuildTimingSummary \
            -only-testing:"$TEST_TARGET" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -collect-test-diagnostics never \
            -resultBundlePath /tmp/player-validation.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee /tmp/player-validation.log
      - name: Record synthetic preview expansion and successor playback
        if: matrix.action == 'test' && matrix.platform == 'iOS' && !inputs.baseline_ref && steps.build.outcome == 'success' && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_preview
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the compiled test bundle. This records only the bounded
          # synthetic-video test, not a second build or the full test suite.
          # XCTest can shut down the simulator after the full suite. Boot the
          # exact recording destination before starting the recorder.
          simulator_id="$SILO_SIMULATOR_ID"
          simulator_state=$(xcrun simctl list devices available --json | jq -r \
            --arg id "$simulator_id" '.devices[][] | select(.udid == $id) | .state')
          if [ "$simulator_state" != Booted ]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl io "$simulator_id" recordVideo /tmp/preview-transition.mp4 &
          recorder_pid=$!
          trap 'kill -INT "$recorder_pid" 2>/dev/null || true; wait "$recorder_pid" || true' EXIT
          package_args=()
          if [ "$SILO_BENCH_VARIANT" != baseline ]; then
            package_args=(-clonedSourcePackagesDirPath "$SILO_SOURCE_PACKAGES_PATH"
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile)
          fi
          xcodebuild test-without-building -project iosApp/Silo.xcodeproj -scheme Silo \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$SILO_DERIVED_DATA" ${package_args[@]+"${package_args[@]}"} \
            -parallel-testing-enabled NO \
            -destination-timeout 60 \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -collect-test-diagnostics never \
            -only-testing:SiloTests/PlayerSurfaceLayoutTests/testPlayingPreviewExpandsWithoutReplacingItemOrLosingItsLayer \
            -resultBundlePath /tmp/preview-recording.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
          kill -INT "$recorder_pid"
          wait "$recorder_pid"
          trap - EXIT
          test -s /tmp/preview-transition.mp4
      - name: Save build caches after successful validation
        if: >-
          env.SILO_BENCH_VARIANT != 'baseline' && !inputs.release_gate &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: ./ci/.github/actions/cache-spm
        with:
          operation: save
          mode: ${{ env.SILO_CACHE_MODE }}
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: ${{ matrix.scheme }}
          save-cache: 'true'
          # Binary artifacts can differ by platform, so each scheme saves its complete graph.
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}
          derived-cache-hit: ${{ steps.cache.outputs.derived-cache-hit }}
      - name: Record benchmark metadata
        if: always()
        env:
          SILO_XCODEGEN_CACHE_HIT: ${{ steps.xcodegen.outputs.cache-hit }}
          SILO_SPM_CACHE_HIT: ${{ steps.cache.outputs.spm-cache-hit }}
          SILO_DERIVED_CACHE_HIT: ${{ steps.cache.outputs.derived-cache-hit }}
          SILO_DERIVED_CACHE_RESTORED: ${{ steps.cache.outputs.derived-cache-restored }}
          SILO_DERIVED_CACHE_KEY: ${{ steps.cache.outputs.derived-cache-key }}
        run: python3 ../ci/scripts/ci/apple-build-metadata.py --root . --benchmark | tee /tmp/apple-benchmark.log
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-validation-${{ matrix.scheme }}
          path: |
            /tmp/player-build.log
            /tmp/player-validation.log
            /tmp/package-resolution.log
            /tmp/apple-benchmark.log
            /tmp/player-validation.xcresult
            /tmp/preview-transition.mp4
            /tmp/preview-recording.xcresult
          retention-days: 7
