name: Apple unsigned device dependency check

on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Reviewed immutable controller commit
        type: string
        required: true
      source_sha:
        description: Clean shipping commit with the reviewed CI and frozen app tree
        type: string
        required: true
      fixture_sha:
        description: Reviewed immutable app fixture commit
        type: string
        required: true
      profile:
        description: Dependency cache arm
        type: choice
        options: ['off', 'prime', 'warm']
        default: 'off'
      namespace:
        description: Isolated cohort namespace, apple-device- plus 1-16 safe characters
        type: string
        required: true
      prime_run_id:
        description: Completed qualified prime run, required only for warm
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: apple-device-dependencies-${{ github.ref }}-${{ inputs.namespace }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DEVICE_BRANCH: refs/heads/private/apple-device-dependency-controller
  DEVICE_PROFILE: ${{ inputs.profile }}
  DEVICE_NAMESPACE: ${{ inputs.namespace }}
  DEVICE_CONTROLLER_SHA: ${{ inputs.controller_sha }}
  DEVICE_SOURCE_SHA: ${{ inputs.source_sha }}
  DEVICE_FIXTURE_SHA: ${{ inputs.fixture_sha }}
  DEVICE_PRIME_RUN_ID: ${{ inputs.prime_run_id }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Reject unsafe controls before preparing app source
        run: |
          python3 controller/scripts/ci/device-benchmark-controls.py preflight \
            --controller-root controller --shipping-ci-manifest controller/scripts/ci/device-benchmark-shipping-ci.json \
            --controller-sha "$DEVICE_CONTROLLER_SHA" --source-sha "$DEVICE_SOURCE_SHA" --fixture-sha "$DEVICE_FIXTURE_SHA" \
            --expected-branch "$DEVICE_BRANCH" --profile "$DEVICE_PROFILE" --namespace "$DEVICE_NAMESPACE" \
            --prime-run-id "$DEVICE_PRIME_RUN_ID" --output "$RUNNER_TEMP/device-preflight.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fixture_sha }}
          path: fixture
          persist-credentials: false
      - name: Bind complete source and CI trees to the reviewed fixture
        run: |
          python3 controller/scripts/ci/device-benchmark-controls.py bind \
            --controller-root controller --source-root source --fixture-root fixture \
            --shipping-ci-manifest controller/scripts/ci/device-benchmark-shipping-ci.json \
            --controller-sha "$DEVICE_CONTROLLER_SHA" --source-sha "$DEVICE_SOURCE_SHA" --fixture-sha "$DEVICE_FIXTURE_SHA" \
            --expected-branch "$DEVICE_BRANCH" --profile "$DEVICE_PROFILE" --namespace "$DEVICE_NAMESPACE" \
            --prime-run-id "$DEVICE_PRIME_RUN_ID" --output "$RUNNER_TEMP/device-binding.json"
      - name: Require both qualified prime receipts before scheduling Macs
        if: inputs.profile == 'warm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for platform in ios tvos; do
            python3 controller/scripts/ci/device-cache-receipt.py prime \
              --run-id "$DEVICE_PRIME_RUN_ID" --platform "$platform" --controller-sha "$DEVICE_CONTROLLER_SHA" \
              --source-sha "$DEVICE_SOURCE_SHA" --fixture-sha "$DEVICE_FIXTURE_SHA" --namespace "$DEVICE_NAMESPACE" \
              --output "$RUNNER_TEMP/device-prime-$platform.json"
          done
  archive:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            scheme: Silo-device
            app: Silo
          - platform: tvos
            scheme: SiloTV-device
            app: SiloTV
    env:
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/source/.ci-cache/packages
      SILO_CACHE_NAMESPACE: ${{ inputs.namespace }}
      SILO_CACHE_MODE: ${{ inputs.profile == 'off' && 'off' || 'dependencies' }}
      SILO_BENCH_VARIANT: optimized
      SILO_SPM_CACHE_PROFILE: scheme
      SILO_COMPILATION_CACHE_ENABLED: 'false'
      SILO_CACHE_PROBE: none
      MARKETING_VERSION: '0.0.1'
      BUILD_NUMBER: '2026100701'
      SILO_RELEASE_SOURCE_URL: https://github.com/Silo-Server/silo-apple/releases/download/v0.0.1-ci-device-benchmark/Silo-source-${{ inputs.source_sha }}.tar.gz
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      BUNDLE_FROZEN: 'true'
      DEVICE_PLATFORM: ${{ matrix.platform }}
      DEVICE_SCHEME: ${{ matrix.scheme }}
      DEVICE_APP: ${{ matrix.app }}
    steps:
      - name: Define owned report directory
        run: |
          echo "DEVICE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "DEVICE_REPORT=$RUNNER_TEMP/device-dependencies-${DEVICE_PLATFORM}" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/device-dependencies-${DEVICE_PLATFORM}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fixture_sha }}
          path: fixture
          persist-credentials: false
      - name: Repeat source binding on the actual build host
        run: |
          python3 controller/scripts/ci/device-benchmark-controls.py bind \
            --controller-root controller --source-root source --fixture-root fixture \
            --shipping-ci-manifest controller/scripts/ci/device-benchmark-shipping-ci.json \
            --controller-sha "$DEVICE_CONTROLLER_SHA" --source-sha "$DEVICE_SOURCE_SHA" --fixture-sha "$DEVICE_FIXTURE_SHA" \
            --expected-branch "$DEVICE_BRANCH" --profile "$DEVICE_PROFILE" --namespace "$DEVICE_NAMESPACE" \
            --prime-run-id "$DEVICE_PRIME_RUN_ID" --output "$DEVICE_REPORT/binding.json"
      - name: Select the shipping Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Record actual device SDK and locked source inputs
        id: metadata
        run: |
          set -euo pipefail
          python3 source/scripts/ci/apple-build-metadata.py --root source --device-scheme "$DEVICE_SCHEME" > "$DEVICE_REPORT/metadata.json"
          python3 controller/scripts/ci/device-cache-receipt.py metadata \
            --metadata "$DEVICE_REPORT/metadata.json" --scheme "$DEVICE_SCHEME" --output "$DEVICE_REPORT/toolchain.json"
      - name: Require fresh package and build output
        run: |
          test ! -e source/.ci-cache
          test ! -e source/build
          python3 controller/scripts/ci/device-cache-receipt.py tree \
            --packages "$SILO_SOURCE_PACKAGES_PATH" --output "$DEVICE_REPORT/packages-fresh.json"
      - name: Bind prime receipt and exact cache identity
        if: inputs.profile == 'warm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py prime \
            --run-id "$DEVICE_PRIME_RUN_ID" --platform "$DEVICE_PLATFORM" --controller-sha "$DEVICE_CONTROLLER_SHA" \
            --source-sha "$DEVICE_SOURCE_SHA" --fixture-sha "$DEVICE_FIXTURE_SHA" --namespace "$DEVICE_NAMESPACE" \
            --output "$DEVICE_REPORT/prime.json"
      - name: Record exact scoped cache presence before restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py cache \
            --metadata "$DEVICE_REPORT/metadata.json" --namespace "$DEVICE_NAMESPACE" --scheme "$DEVICE_SCHEME" \
            --profile "$DEVICE_PROFILE" --required "${{ inputs.profile == 'warm' && 'true' || 'false' }}" \
            --output "$DEVICE_REPORT/cache-before.json"
      - name: Install the same pinned XcodeGen in every arm
        id: xcodegen
        uses: ./source/.github/actions/install-xcodegen
        with:
          cache: 'false'
          namespace: ${{ inputs.namespace }}
          save-cache: 'false'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: source
          bundler-cache: true
          cache-version: ${{ inputs.namespace }}
      - name: Record the locked lane runtime
        working-directory: source
        run: |
          bundle exec ruby -rjson -rfastlane/version -rbundler -e \
            'puts JSON.generate({ruby: RUBY_VERSION, bundler: Bundler::VERSION, fastlane: Fastlane::VERSION})' > "$DEVICE_REPORT/lane-runtime.json"
      - name: Restore only the shipping device dependency cache
        id: cache
        uses: ./source/.github/actions/cache-spm
        with:
          operation: restore
          root: source
          mode: ${{ env.SILO_CACHE_MODE }}
          namespace: ${{ inputs.namespace }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ inputs.source_sha }}
          source-dirty: 'false'
          scheme: ${{ matrix.scheme }}
          spm-profile: scheme
          derived-profile: standard
      - name: Attest the restored dependency content before resolution
        env:
          DEVICE_CACHE_HIT: ${{ steps.cache.outputs.spm-cache-hit }}
          DEVICE_CACHE_PROFILE: ${{ steps.cache.outputs.spm-cache-profile }}
          DEVICE_CACHE_SCOPE: ${{ steps.cache.outputs.spm-cache-scope }}
        run: |
          set -euo pipefail
          python3 controller/scripts/ci/device-cache-receipt.py tree \
            --packages "$SILO_SOURCE_PACKAGES_PATH" --output "$DEVICE_REPORT/packages-restored.json"
          python3 controller/scripts/ci/device-cache-receipt.py restored \
            --report "$DEVICE_REPORT" --profile "$DEVICE_PROFILE" --scheme "$DEVICE_SCHEME" \
            --hit "$DEVICE_CACHE_HIT" --effective-profile "$DEVICE_CACHE_PROFILE" --scope "$DEVICE_CACHE_SCOPE" \
            --output "$DEVICE_REPORT/restore.json"
      - name: Run the existing unsigned Fastlane lane with native command receipts
        timeout-minutes: 36
        run: |
          python3 controller/scripts/ci/device-lane-trace.py --root source --report "$DEVICE_REPORT" \
            --packages "$SILO_SOURCE_PACKAGES_PATH" --platform "$DEVICE_PLATFORM" \
            --graph-helper controller/scripts/ci/apple-package-graph.py
      - name: Inspect the archived app and complete IPA payload
        run: |
          python3 controller/scripts/ci/device-artifact-receipt.py inspect \
            --archive "$GITHUB_WORKSPACE/source/build/${DEVICE_PLATFORM}-unsigned/${DEVICE_APP}.xcarchive" \
            --ipa "$GITHUB_WORKSPACE/source/build/${DEVICE_PLATFORM}-unsigned/${DEVICE_APP}-unsigned.ipa" \
            --platform "$DEVICE_PLATFORM" --source-sha "$DEVICE_SOURCE_SHA" --controller-sha "$DEVICE_CONTROLLER_SHA" \
            --toolchain "$DEVICE_REPORT/toolchain.json" --archive-argv "$DEVICE_REPORT/archive-argv.json" \
            --output "$DEVICE_REPORT/artifact.json"
      - name: Require full payload parity with the qualified prime
        if: inputs.profile == 'warm'
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py prime-artifact --report "$DEVICE_REPORT" \
            --output "$DEVICE_REPORT/prime-artifact.json"
          python3 controller/scripts/ci/device-artifact-receipt.py compare \
            --receipts "$DEVICE_REPORT/prime-artifact.json" "$DEVICE_REPORT/artifact.json" \
            --output "$DEVICE_REPORT/parity.json"
      - name: Attest complete package bytes before a possible cache save
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py tree \
            --packages "$SILO_SOURCE_PACKAGES_PATH" --output "$DEVICE_REPORT/packages-before-save.json"
      - name: Save the qualified cold device graph
        if: inputs.profile == 'prime'
        uses: ./source/.github/actions/cache-spm
        with:
          operation: save
          root: source
          mode: dependencies
          namespace: ${{ inputs.namespace }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ inputs.source_sha }}
          source-dirty: 'false'
          scheme: ${{ matrix.scheme }}
          spm-profile: scheme
          derived-profile: standard
          save-cache: 'true'
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}
      - name: Record cache ID and stored archive bytes after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py cache \
            --metadata "$DEVICE_REPORT/metadata.json" --namespace "$DEVICE_NAMESPACE" --scheme "$DEVICE_SCHEME" \
            --profile "$DEVICE_PROFILE" --required "${{ inputs.profile != 'off' && 'true' || 'false' }}" \
            --output "$DEVICE_REPORT/cache-after.json"
      - name: Seal the bounded device receipt
        env:
          DEVICE_XCODEGEN_HIT: ${{ steps.xcodegen.outputs.cache-hit }}
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py finish --report "$DEVICE_REPORT" \
            --platform "$DEVICE_PLATFORM" --scheme "$DEVICE_SCHEME" --output "$DEVICE_REPORT/receipt.json"
      - name: Require bounded JSON and text evidence
        id: report_bounds
        if: always()
        run: |
          python3 controller/scripts/ci/device-cache-receipt.py upload-bounds --report "$DEVICE_REPORT" \
            --output "$RUNNER_TEMP/device-upload-bounds-${DEVICE_PLATFORM}.json"
      - name: Upload tiny receipts and trimmed log text
        if: always() && steps.report_bounds.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: device-dependencies-${{ matrix.platform }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEVICE_REPORT }}/*.json
            ${{ env.DEVICE_REPORT }}/*.jsonl
            ${{ env.DEVICE_REPORT }}/lane-tail.log
          if-no-files-found: error
          retention-days: 7
