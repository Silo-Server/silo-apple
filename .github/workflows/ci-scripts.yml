name: CI scripts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release input parsing
        run: |
          bash scripts/ci/resolve-marketing-version.test.sh
          python3 scripts/ci/release-version.test.py
          bash scripts/ci/summarize-what-to-test.test.sh
      - name: Test release source archive
        run: python3 scripts/ci/package-release-source.test.py
      - name: Test published source proof reuse
        run: python3 scripts/ci/release-source-proof.test.py
      - name: Test Apple build metadata
        run: python3 scripts/ci/apple-build-metadata.test.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Test locked Fastlane package resolution
        run: ruby scripts/ci/fastlane-cache.test.rb
      - name: Test deferred TestFlight distribution contracts
        run: ruby scripts/ci/fastlane.test.rb
      - name: Test subtitle packaging validation
        run: python3 scripts/ci/validate-subtitle-packaging.test.py
      - name: Test API v2 fixture sync
        run: bash scripts/sync-apiv2-fixtures.test.sh
      - name: Test the /api/v1 path guard
        run: bash scripts/ci/check-no-api-v1.test.sh
      - name: Block new /api/v1 paths in app sources
        run: bash scripts/ci/check-no-api-v1.sh
      - name: Test the app-language lookup guard
        run: bash scripts/ci/check-string-localized.test.sh
      - name: Block text resolved in the process language
        run: bash scripts/ci/check-string-localized.sh
      # The committed catalog must be exactly what the pinned silo-translations
      # release generates. A local pin (no release exists yet) can only be
      # checked against a checkout; see docs/i18n.md.
      - name: Check the generated string catalog
        env:
          # Read access to Silo-Server/silo-translations releases (private
          # repository). Not configured yet.
          GH_TOKEN: ${{ secrets.SILO_TRANSLATIONS_READ_TOKEN }}
        run: |
          version=$(sed -n 's/^version=//p' .silo-translations)
          case $version in
            local-*)
              echo "::notice::.silo-translations pins a local build ($version); check it with scripts/sync-translations --local <checkout> (docs/i18n.md)." ;;
            *)
              scripts/sync-translations
              git diff --exit-code -- iosApp/iosApp/Localizable.xcstrings .silo-translations .silo-translations-files ;;
          esac
