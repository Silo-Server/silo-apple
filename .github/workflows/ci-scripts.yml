name: CI scripts

on:
  pull_request:
    paths:
      - 'scripts/ci/**'
      - '.github/workflows/ci-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - '.github/workflows/ci-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release input parsing
        run: |
          bash scripts/ci/resolve-marketing-version.test.sh
          bash scripts/ci/resolve-platform.test.sh
      - name: Test release source archive
        run: python3 scripts/ci/package-release-source.test.py
