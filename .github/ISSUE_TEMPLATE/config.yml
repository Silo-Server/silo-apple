blank_issues_enabled: false
contact_links:
  - name: Problem with the server or web app
    url: https://github.com/Silo-Server/silo-server/issues/new/choose
    about: Report it in silo-server, especially if it also happens in the web app.
  - name: Problem in the Android phone or TV app
    url: https://github.com/Silo-Server/silo-android/issues/new/choose
    about: Report it in silo-android.
  - name: Questions and setup help
    url: https://discord.gg/siloserver
    about: Ask how to set up or use Silo in the Silo Discord.
  - name: Report a security vulnerability
    url: https://github.com/Silo-Server/silo-apple/security/advisories/new
    about: Report it privately. Do not open a public issue.
  - name: How to report a problem
    url: https://siloserver.org/docs/report-a-problem
    about: Where to find versions, player stats, and diagnostics, and what to include.
  - name: Troubleshoot with an AI agent
    url: https://github.com/Silo-Server/silo-troubleshooting-skill
    about: Use Claude Code or Codex to collect the details and draft a reviewed report.
