observed_ux_note: >
  Two sequential loading indicators at DV loopback start (owner-reported on the Minecraft title): indicator 1 is
  the app's loading overlay during plan fetch + loopback session spin-up (FFmpeg open, 1514-segment VOD plan,
  FLAC transcoder setup); it clears at player attach. Indicator 2 is AVPlayer's own buffering HUD between attach
  and first frame, spanning the Dolby Vision HDMI mode switch (screen re-sync) — first frame at 5.5 s, no stall
  after. Not a defect; a possible polish item is holding the app overlay until first frame so the handoff reads
  as one continuous load.
