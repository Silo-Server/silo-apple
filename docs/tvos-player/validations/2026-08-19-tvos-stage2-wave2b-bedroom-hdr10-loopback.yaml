startup_failure_investigation:  # the reason this record exists; VERDICT: not a wave-2 regression
  symptom: >
    Earlier capture (untimestamped): two consecutive loopback attempts at anchor 499.4 s died with
    "Remuxer failed: prematureSourceEnd(readRC: -1414092869 ['EXIT'], shortfallBytes≈14.46 GB)". Each
    failure was followed by a correct policy replan to server HLS (suspension on reason=server_replan →
    replan → suspension off → HDR10 item ready) — the wave-2b recovery machinery behaved as designed.
  control: pre-wave-2 build (9756ff4) played the same title's loopback cleanly minutes later (different anchor).
  root_cause: >
    Code-proven (files byte-identical across both builds): the 'EXIT' + prematureSourceEnd combination can
    only be produced by the writer's 10 s read-deadline abort (LoopbackIngestEndPolicy.classify requires
    deadlineAborted=true; every stop()/teardown path is excluded because the mux loop checks cancellation
    before classification). The failing av_read_frame blocked ≥10 s on a 4 MB origin chunk fetch that was
    still in flight — no outage flag, no fetch failure. The same capture shows the server 404ing transcode
    segments. Re-running the wave-2b build after the server recovered: loopback plays perfectly (row_3 above).
    The apparent determinism was source-cache adoption warming attempt 2 to the same in-flight byte.
  falsifier_run: wave-2b build re-run with timestamps — anchor 2204.7 s, producer anchor +2 s, no failure.
  follow_ups:  # none block the wave-2b gate; tracked in the cleanup backlog
    - "LoopbackSegmentWriter: phase-aware startup read deadline (30 s pre-first-segment) + one retry on a
       deadline abort, so a single slow chunk is a hiccup, not a route kill"
    - "PlaybackSourceProxy: mirror the decisive transport lines (get end cause / window claim diverted /
       chunk gave up / window gave up / origin retargeted) to cmpLog — they are OSLog-only and invisible in
       every console capture, which made this investigation slower than it needed to be"
    - "TrackSelectionCoordinator: automatic (non-user) subtitle re-selection can request a route-changing
       replan right after a recovery replan (observed: sti:2/subrip → sti:-1/srt), amplifying one loopback
       failure into a loopback⇄HLS oscillation; add a cooldown guard (pre-existing behaviour, unchanged by
       Stage 2)"

